<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Chobrima Prints</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 8%;
        }

        .checkout {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h2 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .product-name {
            font-weight: bold;
            font-size: 20px;
        }

        .price {
            font-size: 24px;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            background: #111;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }
    </style>
</head>

<body>

<header>
    <h1>CHOBRIMA PRINTS</h1>
</header>

<div class="checkout">

    <h2>Checkout</h2>

    <p class="product-name">
        Blessed Forever Design V.1
    </p>

    <p>
        Digital Download — SVG + PNG
    </p>

    <div class="price">
        ₱99
    </div>

    <form action="/payment" method="POST">

    <label>Full Name</label>
    <input type="text" name="name" required>

    <label>Email Address</label>
    <input type="email" name="email" required>

    <button type="submit">
        PROCEED TO PAYMENT
    </button>

</form>

</div>

</body>
</html>
